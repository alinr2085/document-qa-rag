services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SysPass123} # SYS/SYSTEM password
      APP_USER: ${ORACLE_USER:-docqa} # created in FREEPDB1 on first start
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-docqa_pass}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_ENGINE: oracle
      ORACLE_HOST: oracle
    volumes:
      - ./data:/app/data # uploaded files persist here
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
